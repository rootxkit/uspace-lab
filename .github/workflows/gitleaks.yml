name: gitleaks

# No key, secret or token in the repository (spec 06 §4, WP-L2). Every
# commit of every push and pull request, whatever it touches.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks v8.30.0, pinned by digest.
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --redact --verbose --exit-code 1 /repo
