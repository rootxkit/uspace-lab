# gitleaks configuration for uspace-lab (WP-L2; spec 06 §4): the default
# rules plus two narrow rule allowlists, adapted from uspace-core's
# .gitleaks.toml for the vectors this repository keeps under
# knowledge/vectors/. Read by gitleaks from the repository root.
#
# There is deliberately no global [allowlist]: allowlists on a rule touch
# that rule only, so any other secret in these files is still reported.
# The lab issuer's generated key and secrets live in deploy/local/, which
# is git-ignored and never scanned as committed content.
title = "uspace-lab"

[extend]
useDefault = true

# The knowledge vectors carry EU operator registration numbers in their
# public form ("compare_key": the number with the three secret characters
# already stripped, LESSONS G-05); generic-api-key reads the key name as a
# credential. Limited to that rule, to compare_key lines and to the vector
# files.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "public operator numbers in the knowledge vectors"
condition = "AND"
paths = ['''^knowledge/vectors/[^/]+\.json$''']
regexTarget = "line"
regexes = ['''"compare_key"\s*:''']

# internal/seed/seed_test.go checks the seed's TOTP against RFC 6238
# Appendix B, whose shared secret is the published ASCII
# "12345678901234567890" (base32 GEZDGNBVGY3TQOJQ...): a test vector of
# the RFC, not a credential. Limited to this rule, that file and lines
# holding that value.
[[rules.allowlists]]
description = "the RFC 6238 test secret in the seed's TOTP test"
condition = "AND"
paths = ['''^internal/seed/seed_test\.go$''']
regexTarget = "line"
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']

# The basemap tests (WP-L3) carry entries of the Protomaps builds list,
# whose "key" is the build's file name, YYYYMMDD.pmtiles; generic-api-key
# reads the key name as a credential. Limited to this rule, to those two
# test files and to lines where the value is a build file name.
[[rules.allowlists]]
description = "Protomaps build file names in the basemap tests"
condition = "AND"
paths = ['''^internal/basemap/(fixture|source)_test\.go$''']
regexTarget = "line"
regexes = ['''(?i)"?key"?\s*:\s*"[0-9]{8}\.pmtiles"''']

# jwt_verify.json carries test JWTs signed by a key generated at run time
# by uspace-core's auth/internal/genvectors and discarded, so they grant
# nothing anywhere. Limited to the jwt rule and to that one file.
[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "discarded-key test tokens in the jwt_verify vector"
paths = ['''^knowledge/vectors/jwt_verify\.json$''']
