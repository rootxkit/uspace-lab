format: scenario/v1
id: sc-21-slow-to-hover
title: "SC-21: slowing to hover beside another aircraft"
source: "knowledge/scenarios.md SC-21 (P5-12, not yet run in utm); LESSONS C-03, C-10"
owners: [ussp, authority]
policy: policy/demo.yaml
systems: [ussp]
reference: true
note: >-
  A hovers 10 m west of the origin; B, 300 m east of it, flies straight
  at A at 10 m/s and decelerates to hover 40 m from it (30 m east of the
  origin). Expected: a conflict no later than B's first sample inside
  60 m (C-03 holds it while inside), never cleared while B hovers there.
  How late the raise is relative to B crossing 60 m is in the result
  (the vehicles' steps and the raise times); it is the number SC-21
  asks for. Owed by uspace-ussp WP-11. Each aircraft files its own
  volume, 9 m apart between the homes (A's west of 8 m east, B's east
  of 17 m east): a USSP deconflicts intents strategically and
  authorises only the first of two that overlap, which left B with no
  flight to alert on (results/20261004-systems finding 7). B meets A
  from the east, across the shared edge, rather than from the south as
  before, because both homes are on one east-west line. At 80 m: the
  SITL ground rises to the east of home (over 624 m 100 m east against
  605 m, sim/README.md).
duration_s: 240
# B lands 30 m east of home from 80 m: about 73 s (LandS); 80 s left
# after the landing's at_s.
tail_s: 5
aircraft:
  - name: a
    sysid: 1
    serial: LABX9SC21A0001
    operator_reg: GEOLAB000001
    operator:
      system: ussp
      intent:
        boxes: [{south_m: -100, north_m: 100, west_m: -150, east_m: 8}]
        alt_lower_rel_m: -20
        alt_upper_rel_m: 120
        starts_before_s: 60
        lasts_s: 3600
        category: open
        subcategory: A2
        class_label: C2
  - name: b
    sysid: 2
    serial: LABX9SC21B0002
    operator_reg: GEOLAB000001
    operator:
      system: ussp
      intent:
        boxes: [{south_m: -100, north_m: 100, west_m: 17, east_m: 350}]
        alt_lower_rel_m: -20
        alt_upper_rel_m: 120
        starts_before_s: 60
        lasts_s: 3600
        category: open
        subcategory: A2
        class_label: C2
steps:
  - id: climb
    at_s: 0
    aircraft: [a, b]
    do: takeoff
    alt_rel_m: 80
  - id: a-station
    aircraft: [a]
    do: goto
    to: {north_m: 0, east_m: -10}
    speed_ms: 3
  - id: b-start
    aircraft: [b]
    do: goto
    to: {north_m: 0, east_m: 290}
    speed_ms: 8
  - id: approach
    at_s: 85
    aircraft: [b]
    do: goto
    to: {north_m: 0, east_m: 30}
    speed_ms: 10
  - id: beside
    aircraft: [b]
    do: hold
    for_s: 30
  - id: down
    at_s: 160
    aircraft: [a, b]
    do: land
expect:
  - name: on-the-ground-a
    system: ussp
    kind: proximity
    aircraft: a
    peer: b
    raise: {after: climb, min_s: -40, max_s: 5}
    clear: {after: climb, min_s: 0, max_s: 60, reason: resolved}
  - name: on-the-ground-b
    system: ussp
    kind: proximity
    aircraft: b
    peer: a
    raise: {after: climb, min_s: -40, max_s: 5}
    clear: {after: climb, min_s: 0, max_s: 60, reason: resolved}
  - name: beside-a
    system: ussp
    kind: proximity
    aircraft: a
    peer: b
    raise: {after: approach.start, min_s: 0, max_s: 35}
    hold_until: {after: beside, min_s: 0, max_s: 0}
  - name: beside-b
    system: ussp
    kind: proximity
    aircraft: b
    peer: a
    raise: {after: approach.start, min_s: 0, max_s: 35}
    hold_until: {after: beside, min_s: 0, max_s: 0}
expect_intents:
  - {aircraft: a, decision: authorised, state: activated}
  - {aircraft: b, decision: authorised, state: activated}
judged_kinds: ["ussp:proximity"]
measure: [latency, ledger]
