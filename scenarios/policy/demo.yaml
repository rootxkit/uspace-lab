# The demo policy (docs/PLAN.md §7.1 L-Q4): the Art. 3(4) figures the lab
# uses until GCAA decides them (ussp Q6, spec Q17), and the monitor
# defaults of knowledge/scenarios.md. Every scenario loads this file and
# every result prints it with its policy_version. The systems under test
# run their own policy; a scenario's expectations assume these figures,
# and the lab's reference target judges with them.
policy_version: 1
source: "docs/PLAN.md §7.1 L-Q4 (owner-only, open; GCAA answers); knowledge/scenarios.md conventions"
deviation:
  h_m: 50
  v_m: 15
  t_s: 60
telemetry_lost_s: 5
lost_link_s: 15
nonconformance_nearby_radius_m: 2000
cpa:
  t_cpa_max_s: 60
  d_horizontal_min_m: 60
  d_vertical_min_m: 20
  neighbour_radius_m: 800
  neighbour_max_age_s: 10
height_limit_agl_m: 120
monitor:
  clear_after_s: 3
  stale_after_s: 15
  live_max_age_s: 10
  pressure_uncertainty_m: 250
  conditional_severity: warning
