note: "The traffic make chaos runs under the faults (scripts/chaos/README.md). One aircraft, streamed to the USSP and heard by a receiver of the authority, flies into a 120 m CONDITIONAL zone 300 m north of home and holds there while the faults run, then leaves it to the north and lands. Each system must raise one zone_incursion, keep it through every fault and restart (a second raise is a duplicate, a false alert to the verdict), and clear it once after the exit. The hold below is a placeholder: scripts/chaos writes a copy whose hold and duration cover the selected rows of its matrix, and runs that copy. Zone, receiver and aircraft are SC-03's arrangement, except the zone type: the USSP holds an intent that overlaps a REQ_AUTHORIZATION zone at pending_authority (seen by WP-L9), so the operator could not fly; a CONDITIONAL zone authorises the intent with the zone's condition and is still an incursion to both systems. The zone's lower limit is 0 m AMSL so it holds from the ground up without terrain."
