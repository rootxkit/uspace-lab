    licence: OFL-1.1
    version: Version 2.015
  - id: noto-sans-georgian-regular
    url: https://raw.githubusercontent.com/notofonts/notofonts.github.io/e3ff34c3178cb4012124c9e6390b9a3535ff2c3f/fonts/NotoSansGeorgian/unhinted/ttf/NotoSansGeorgian-Regular.ttf
