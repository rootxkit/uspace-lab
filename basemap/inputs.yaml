# WP-L3 inputs of the basemap bundle. Every file the build downloads is
# pinned by commit and SHA-256 with its licence and source; `basemap
# fetch` refuses a file whose hash differs, and a font whose name-table
# version differs from `version`. SOURCE.json repeats all of it.
#
# The tiles are the exception: a Protomaps daily build is one planet
# file of over 100 GB, so the build records the upstream's own size and
# BLAKE3 from the builds list, and the SHA-256 of the extract it made.

tiles:
  builds: https://build-metadata.protomaps.dev/builds.json
  base: https://build.protomaps.com/
  licence: "ODbL-1.0 (OpenStreetMap contributors); Natural Earth, public domain"

# The basemaps-assets commit the sprites come from (the same commit as
# uspace-ui's browser-test extract).
assets: https://github.com/protomaps/basemaps-assets@028c18f713baecad011301ff7a69acc39bcc2ae7

licence: >-
  Map data (c) OpenStreetMap contributors, ODbL 1.0, via the Protomaps
  basemap; Natural Earth, public domain. Glyphs drawn from Noto Sans and
  Noto Sans Georgian, SIL OFL 1.1 (fonts/OFL.txt). Sprites from
  protomaps/basemaps-assets, derived from tangrams/icons, MIT
  (sprites/v4/LICENSE.md).

# The glyph sets, as the Protomaps style layers name them (Regular,
# Medium, Italic); "Noto Sans Regular" is the kit's mapFontstack. Fonts
# are tried in order per code point: Noto Sans first, Noto Sans Georgian
# for what it lacks. Noto Sans Georgian has no italic, so the Italic
# stack (water and park labels) falls back to its Regular.
fontstacks:
  - name: Noto Sans Regular
    fonts: [noto-sans-regular, noto-sans-georgian-regular]
  - name: Noto Sans Medium
    fonts: [noto-sans-medium, noto-sans-georgian-medium]
  - name: Noto Sans Italic
    fonts: [noto-sans-italic, noto-sans-georgian-regular]

inputs:
  # Fonts: notofonts.github.io, the unhinted TTFs basemaps-assets builds
  # from (its scripts/create_fonts.sh), pinned at one commit.
  - id: noto-sans-regular
    url: https://raw.githubusercontent.com/notofonts/notofonts.github.io/e3ff34c3178cb4012124c9e6390b9a3535ff2c3f/fonts/NotoSans/unhinted/ttf/NotoSans-Regular.ttf
    sha256: f3961a9cde016d41a4879aecda1474d3a36d6bf54fa0e4643de029cc2248b0e8
    licence: OFL-1.1
    version: Version 2.015
  - id: noto-sans-medium
    url: https://raw.githubusercontent.com/notofonts/notofonts.github.io/e3ff34c3178cb4012124c9e6390b9a3535ff2c3f/fonts/NotoSans/unhinted/ttf/NotoSans-Medium.ttf
    sha256: 220e74546aee1b9a17cd50025dd917a064d0224e653f562287446c2328e4160b
    licence: OFL-1.1
    version: Version 2.015
  - id: noto-sans-italic
    url: https://raw.githubusercontent.com/notofonts/notofonts.github.io/e3ff34c3178cb4012124c9e6390b9a3535ff2c3f/fonts/NotoSans/unhinted/ttf/NotoSans-Italic.ttf
