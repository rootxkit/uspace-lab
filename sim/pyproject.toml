# Tool configuration for sim/ (Python 3.12): ruff lint and format, mypy
# --strict, pytest (docs/PLAN.md §6). Not a package: the scripts run as
# files (python sim/mav_reader.py).
[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "RUF"]
ignore = [
  "S101", # assert is how pytest asserts
  "S603", # subprocess with a fixed argument list (tests start stand-ins)
  "S607", # tests call setsid, pgrep and bash from PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["mav_reader.py", "fly.py", "tests"]
exclude = ['.venv/', 'out/']

[[tool.mypy.overrides]]
module = ["pymavlink", "pymavlink.*", "jsonschema"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
