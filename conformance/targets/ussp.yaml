# The USSP's conformance target (uspace-ussp docs/PLAN.md conformance
# row, its WP-19): the national contract with an operator client of its
# own issuer and the lab's ecosystem client, and the F3411 SP and F3548
# suites through the InterUSS interfaces it exposes.
system: ussp
name: ${CONFORMANCE_TARGET_NAME:-ussp}
role: own
participant: ${USSP_CONFORMANCE_PARTICIPANT:-ussp-DEV01-01}
base_url: ${USSP_CONFORMANCE_BASE_URL}
images:
  ussp: ${USSP_IMAGE:-unrecorded}
contract:
  openapi: ${CONFORMANCE_USSP_OPENAPI:-api/ussp/openapi.yaml}
  schemas: ${CONFORMANCE_USSP_SCHEMAS:-schemas/ussp}
issuers:
  ecosystem:
    token_url: ${LAB_TOKEN_URL}
    client_id: lab-01
    secrets_json: ${LAB_SECRETS_JSON:-deploy/local/client-secrets.json}
    audience: ${USSP_CONFORMANCE_AUDIENCE:-}
    offers: [police.query, cis.read]
  operator:
    # An operator machine client registered at the USSP (portal).
    token_url: ${USSP_CONFORMANCE_OPERATOR_TOKEN_URL:-}
    client_id: ${USSP_CONFORMANCE_OPERATOR_CLIENT_ID:-}
    secret_file: ${USSP_CONFORMANCE_OPERATOR_SECRET_FILE:-}
    audience: ${USSP_CONFORMANCE_AUDIENCE:-}
    offers: [ussp.intents, ussp.geo, ussp.telemetry, ussp.traffic]
session:
  bearer_file: ${USSP_CONFORMANCE_SESSION_FILE:-}
fixtures:
  operator: ${USSP_CONFORMANCE_OPERATOR:-}
pages: []
# The InterUSS automated-testing interfaces of the USSP's
# test-interfaces process (uspace-ussp WP-21), as uss_qualifier reaches
# them: F3411-SP drives rid_injection, F3411-DP rid_observation and
# F3548-SCD flight_planning (conformance/uss_qualifier/coverage.yaml).
# The observation interface is a Display Provider's and is held to
# F3411-22a's area bound: a view whose diagonal is over
# NetMaxDisplayAreaDiagonalKm (7 km, uspace-core f3411) must be refused,
# which uss_qualifier checks ("Too long diagonal query fails").
interfaces:
  rid_injection: ${USSP_CONFORMANCE_RID_INJECTION_URL:-}
  rid_observation: ${USSP_CONFORMANCE_RID_OBSERVATION_URL:-}
  flight_planning: ${USSP_CONFORMANCE_FLIGHT_PLANNING_URL:-}
