$content_schema: monitoring/uss_qualifier/configurations/configuration/USSQualifierConfiguration.json
# F3548-21 strategic coordination with the system under test as the
# first USS (flights planned through its InterUSS flight_planning v1
# interface) and the InterUSS mock USS as the second, both on the lab
# DSS. Decides F3548-SCD (a gate by the L-Q3 default). Rendered by
# `conformance qualifier-render`; the keys are those of the commit SOURCE
# pins (suites/astm/utm/f3548_21.yaml, dev/f3548_self_contained.yaml).
v1:
  test_run:
    resources:
      resource_declarations:
        id_generator: {$ref: 'library/resources.yaml#/id_generator'}
        tbilisi_planning_area_volume: {$ref: 'library/resources.yaml#/tbilisi_planning_area_volume'}
        planning_area: {$ref: 'library/resources.yaml#/tbilisi_planning_area'}
        problematically_big_area: {$ref: 'library/resources.yaml#/problematically_big_area'}
        conflicting_flights: {$ref: 'library/resources.yaml#/conflicting_flights'}
        invalid_flight_intents: {$ref: 'library/resources.yaml#/invalid_flight_intents'}
        non_conflicting_flights: {$ref: 'library/resources.yaml#/non_conflicting_flights'}
        test_exclusions: {$ref: 'library/resources.yaml#/test_exclusions'}

        utm_auth: {$ref: 'library/environment.yaml#/utm_auth'}
        utm_client_identity: {$ref: 'library/environment.yaml#/utm_client_identity'}
        dss: {$ref: 'library/environment.yaml#/scd_dss'}
        dss_instances: {$ref: 'library/environment.yaml#/scd_dss_instances'}
        mock_uss: {$ref: 'library/environment.yaml#/mock_uss_scd'}

        flight_planners:
          resource_type: resources.flight_planning.FlightPlannersResource
          dependencies:
            auth_adapter: utm_auth
          specification:
            flight_planners:
              - participant_id: "${QUALIFIER_PARTICIPANT}"
                v1_base_url: ${QUALIFIER_TARGET_INTERFACE_URL}
              - participant_id: mock_uss
                v1_base_url: ${QUALIFIER_MOCK_SCD_URL}/flight_planning/v1
    non_baseline_inputs:
      - v1.test_run.resources.resource_declarations.utm_auth
      - v1.test_run.resources.resource_declarations.flight_planners
      - v1.test_run.resources.resource_declarations.dss
      - v1.test_run.resources.resource_declarations.dss_instances
      - v1.test_run.resources.resource_declarations.mock_uss
    action:
      test_suite:
        suite_type: suites.astm.utm.f3548_21
        resources:
          id_generator: id_generator
          utm_client_identity: utm_client_identity
          flight_planners: flight_planners
          flight_planners_to_clear: flight_planners
          conflicting_flights: conflicting_flights
          priority_preemption_flights: conflicting_flights
          invalid_flight_intents: invalid_flight_intents
          non_conflicting_flights: non_conflicting_flights
          dss: dss
          dss_instances: dss_instances
          interuss_dss_instances: dss_instances
          mock_uss: mock_uss
          utm_auth: utm_auth
          planning_area: planning_area
          problematically_big_area: problematically_big_area
          test_exclusions: test_exclusions
    execution:
      stop_fast: false
  artifacts:
    raw_report: {}
    sequence_view: {}
