# Load tier 1000-soak (WP-L8): 1000 drones, the 2 h soak
# Volumes from spec 05 §1, column 1000. Figures marked pending GCAA are
# the spec's defaults (docs/PLAN.md §7.1); GCAA has not answered.
tier: "1000-soak"
title: "1000 drones, the 2 h soak"
column: 1000
duration_s: 7200
drain_s: 60
operators:
  aircraft: 1000
  clients: 50
  telemetry_hz: 1
  telemetry_hz_status: pending GCAA # Art. 8(3) determination; 05 §1
  poll_ms: 50
  ramp_per_s: 250 # clients connecting per second at the start
  intents: all
receivers:
  heard_fraction: 0.4 # 05 §1: ~40 % heard by at least one receiver
  aircraft_per_receiver: 20
  transports: [pack, single] # BT5 / Wi-Fi packs and BT4 legacy, alternating per receiver
  batch_ms: 100
consoles: 30
watch:
  pairs: 15
  walkers: 15
min_samples: 1000
memory_sample_s: 10
memory_warmup_s: 900 # the target's 600 s telemetry dedupe window fills first
required:
  - operator_rate
  - rid_rate
  - operator_to_console_p99
  - receiver_to_picture_p99
  - proximity_raise_p99
  - expected_set
  - missed_raises
  - missed_clears
  - no_false_alarm
  - alerts_traceable
  - operator_identity
  - receiver_identity
  - picture_identity
  - picture_traceable
  - traffic_traceable
  - evaluation_period
  - memory_monotonic
  - memory_growth
scale:
  - {quantity: console viewports, spec: "30 consoles each viewing <= 200 tracks (05 §1)", here: "the same count, each subscribed to the whole area", factor: 1, why: "the reference picture has no viewport throttle; whole-area subscriptions are the worst case"}
# 05 §7 load sources this harness does not drive yet (the report lists
# them; their rows stay "not measured").
not_generated:
  - {source: "ANSP manned feed (tens of aircraft)", why: "the reference target has no manned intake; the systems mode is not built yet"}
  - {source: "sim-ussp as the second USSP on a local DSS", why: "the reference target has no DSS or peer interface; the F3411 and F3548 rows wait for the systems mode"}
  - {source: "authority DP polls of the USSPs (05 §1: one view per 1 Hz)", why: "the reference authority has no DP poller"}
  - {source: "optional national push USSP -> authority", why: "disabled by default (02 F6) and not in the reference target"}
