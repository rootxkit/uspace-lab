# Load tier ci (WP-L8): CI: the 100-drone volumes for two minutes
# Volumes from spec 05 §1, column 100. Figures marked pending GCAA are
# the spec's defaults (docs/PLAN.md §7.1); GCAA has not answered.
tier: "ci"
title: "CI: the 100-drone volumes for two minutes"
column: 100
duration_s: 120
drain_s: 20
operators:
  aircraft: 100
  clients: 10
  telemetry_hz: 1
  telemetry_hz_status: pending GCAA # Art. 8(3) determination; 05 §1
  poll_ms: 50
  ramp_per_s: 250 # clients connecting per second at the start
  intents: all
receivers:
  heard_fraction: 0.4 # 05 §1: ~40 % heard by at least one receiver
  aircraft_per_receiver: 10
  transports: [pack, single] # BT5 / Wi-Fi packs and BT4 legacy, alternating per receiver
  batch_ms: 100
consoles: 2
watch:
  pairs: 4
  walkers: 4
min_samples: 200
memory_sample_s: 10
memory_warmup_s: 0 # too short to judge memory at all (criteria min_duration_s)
required:
  - operator_rate
  - rid_rate
  - generator_on_time
  - operator_to_console_p99
  - receiver_to_picture_p99
  - proximity_raise_p99
  - expected_set
  - missed_raises
  - missed_clears
  - no_false_alarm
  - alerts_traceable
  - operator_identity
  - receiver_identity
  - picture_identity
  - picture_traceable
  - traffic_traceable
  - evaluation_period
scale:
  - {quantity: duration, spec: "3600 s (05 §7)", here: "120 s", factor: 0.0333, why: "a pull request's CI budget; one crossing per pair still falls inside it"}
  - {quantity: consoles, spec: "10 (05 §1 at 100 drones)", here: "2", factor: 0.2, why: "every console here subscribes to the whole area (heavier than 05 §1's <= 200-track viewports); two keep the fan-out real at CI size"}
  - {quantity: soak, spec: "2 h at the target tier", here: "none", factor: 0, why: "memory growth is not judged under 600 s (criteria min_duration_s)"}
# 05 §7 load sources this harness does not drive yet (the report lists
# them; their rows stay "not measured").
not_generated:
  - {source: "ANSP manned feed (tens of aircraft)", why: "the reference target has no manned intake; the systems mode is not built yet"}
  - {source: "sim-ussp as the second USSP on a local DSS", why: "the reference target has no DSS or peer interface; the F3411 and F3548 rows wait for the systems mode"}
  - {source: "authority DP polls of the USSPs (05 §1: one view per 1 Hz)", why: "the reference authority has no DP poller"}
  - {source: "optional national push USSP -> authority", why: "disabled by default (02 F6) and not in the reference target"}
